name: foodwise

services:
  postgres:
    image: postgres:16-alpine
    container_name: foodwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foodwise}
      POSTGRES_USER: ${POSTGRES_USER:-foodwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodwise}
    volumes:
      - foodwise-pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    networks:
      - foodwise-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foodwise} -d ${POSTGRES_DB:-foodwise}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: foodwise/server:latest
    container_name: foodwise-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-foodwise};Username=${POSTGRES_USER:-foodwise};Password=${POSTGRES_PASSWORD:-foodwise}"
    expose:
      - "8080"
    ports:
      # zewn\u0119trzny dost\u0119p tylko dla dev/debug; w produkcji przez cloudflared
      - "${SERVER_HOST_PORT:-5166}:8080"
    networks:
      - foodwise-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: foodwise/client:latest
    container_name: foodwise-client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_started
    expose:
      - "8080"
    ports:
      - "${CLIENT_HOST_PORT:-3000}:8080"
    networks:
      - foodwise-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: foodwise-cloudflared
    restart: unless-stopped
    # Tryb token (zalecany): ustaw CLOUDFLARED_TOKEN w .env, mapowanie hostname -> us\u0142uga
    # konfigurujesz w panelu Cloudflare Zero Trust > Networks > Tunnels.
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN}
    depends_on:
      client:
        condition: service_started
      server:
        condition: service_started
    networks:
      - foodwise-net
    profiles:
      - tunnel
    environment:
      TUNNEL_METRICS: 0.0.0.0:2000

  # Alternatywa: tunel "quick" bez logowania (losowy URL trycloudflare.com) - do test\u00f3w.
  cloudflared-quick:
    image: cloudflare/cloudflared:latest
    container_name: foodwise-cloudflared-quick
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://client:8080
    depends_on:
      client:
        condition: service_started
    networks:
      - foodwise-net
    profiles:
      - quick

networks:
  foodwise-net:
    driver: bridge

volumes:
  foodwise-pgdata:
